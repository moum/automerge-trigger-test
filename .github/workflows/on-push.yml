name: On push to main (stands in for ci-semver)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  semver:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }} actor=${{ github.actor }} triggering_actor=${{ github.triggering_actor }} sha=${{ github.sha }}"
          echo "secret_length=${#TEST_SECRET} (7=Actions secret, 15=Dependabot copy, 0=absent)"
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
