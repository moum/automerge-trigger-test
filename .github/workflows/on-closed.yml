name: On PR closed (fallback B1 - dispatch after native auto-merge)
on:
  pull_request_target:
    types: [closed]
permissions:
  actions: write
jobs:
  dispatch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run on-push.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
